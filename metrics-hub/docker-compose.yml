# Omnia Metrics Hub — para VPS + Coolify. Un solo servicio Node que clona los
# repos configurados, agrega telemetría+commits en bucle y sirve el dashboard.
# En Coolify: recurso "Docker Compose" apuntando a este repo; expón el 4320 con
# un dominio/TLS de Coolify.
services:
  metrics-hub:
    build: .
    image: omnia/metrics-hub:latest
    restart: unless-stopped
    # BasicAuth vía Traefik (ver vision/specs/services/expose-metrics-hub-domain/).
    # '$' del hash bcrypt escapado a '$$' (Docker Compose interpola '$' como var).
    # El hash es seguro de versionar (unidireccional); la contraseña en texto
    # plano nunca se guarda en este ni en ningún otro archivo del repo.
    labels:
      - "traefik.http.middlewares.metrics-auth.basicauth.users=daniel@omniaos.ai:$$2y$$05$$RSfpkDYnWfHdteDgZDjepuozu4ogao0vW3qnJLi8GIHufdnVlgESi"
      - "coolify.traefik.middlewares=metrics-auth"
      # Override manual: el generador de reglas de Coolify para este recurso
      # produce "Host(``) && PathPrefix(`metrics.omniaos.ai`)" (roto — Host
      # vacío), probablemente por el binding "127.0.0.1:4320:4320" de abajo.
      # Se fija la regla y los middlewares a mano hasta confirmar la causa.
      - "traefik.http.routers.http-0-rezt6ydunq77iliyzpzkf0xh-metrics-hub.rule=Host(`metrics.omniaos.ai`)"
      - "traefik.http.routers.http-0-rezt6ydunq77iliyzpzkf0xh-metrics-hub.middlewares=metrics-auth,gzip"
    environment:
      # Repos a agregar (CSV owner/repo).
      - HUB_REPOS=${HUB_REPOS:-OmniaOs/OmniaPOS,OmniaOs/VisionFramework,OmniaOs/frutal,OmniaOs/weritas}
      # Token para clonar repos privados.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Cada cuánto re-colectar (segundos).
      - HUB_INTERVAL=${HUB_INTERVAL:-3600}
    # Solo loopback: acceso remoto por túnel SSH (post-incidente 20-jul-2026).
    ports:
      - "127.0.0.1:4320:4320"
    volumes:
      - hub_repos:/repos

volumes:
  hub_repos:
