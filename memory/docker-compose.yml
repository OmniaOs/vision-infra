# Omnia — stack de memoria compartida + self-learning (para VPS + Coolify).
# Basado en el docker-compose oficial de OpenMemory (mem0ai/mem0), adaptado a
# producción: imágenes publicadas (sin build ni --reload), volúmenes persistentes.
#
# Servicios:
#   qdrant          store vectorial (interno, no expuesto públicamente)
#   openmemory-mcp  API + servidor MCP de la memoria compartida (:8765)
#   openmemory-ui   dashboard web de la memoria (:3000)
#   hermes          daemon de self-learning (propone → humano aprueba)
#
# SEGURIDAD (post-incidente 20-jul-2026): TODOS los puertos se publican solo en
# 127.0.0.1 — el acceso remoto es por túnel SSH, nunca por puerto abierto a
# internet. La UI (openmemory-ui) queda DESACTIVADA por defecto (profile "ui"):
# fue el vector del exploit (RCE sin auth) y Coolify inyecta las env del app a
# todos los contenedores del stack, así que la UI exponía tokens que no usaba.
# Solo activarla detrás de auth (Traefik BasicAuth) o vía túnel: COMPOSE_PROFILES=ui.
services:
  # OJO: el servicio DEBE llamarse 'mem0_store' — es el host que OpenMemory
  # hardcodea en su config por defecto para el vector store (qdrant).
  mem0_store:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # sin 'ports': solo accesible dentro de la red del stack

  openmemory-mcp:
    image: mem0/openmemory-mcp
    restart: unless-stopped
    environment:
      - USER=${OMNIA_MEMORY_DEFAULT_USER:-omnia}
      - API_KEY=${OPENMEMORY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=mem0_store
      - QDRANT_PORT=6333
      # La base de OpenMemory (usuarios, apps, categorias) vivia en la capa del contenedor y se
      # perdia en cada redeploy; solo los vectores (Qdrant) sobrevivian. Ahora va al volumen.
      - DATABASE_URL=sqlite:////usr/src/openmemory/data/openmemory.db
      # LLM/Embedder configurables; por defecto OpenAI. Para usar el gateway de
      # Omnia (API keys de pago, OpenAI-compatible), apunta LLM_BASE_URL ahí.
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-openai}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-text-embedding-3-small}
    depends_on:
      - mem0_store
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - openmemory_data:/usr/src/openmemory/data
      # history.db de mem0 (~/.mem0) tambien se perdia en cada redeploy.
      - openmemory_mem0home:/root/.mem0
    # --workers 1: evita la carrera en SQLite (apps.owner_id) al primer arranque.
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8765 --workers 1"

  openmemory-ui:
    image: mem0/openmemory-ui:latest
    restart: unless-stopped
    # Desactivada por defecto (ver nota de SEGURIDAD arriba).
    profiles: ["ui"]
    environment:
      - NEXT_PUBLIC_API_URL=${OPENMEMORY_PUBLIC_API_URL}
      - NEXT_PUBLIC_USER_ID=${OMNIA_MEMORY_DEFAULT_USER:-omnia}
    depends_on:
      - openmemory-mcp
    ports:
      - "127.0.0.1:3000:3000"

  # Puerta unica de acceso para los devs (ver access/README.md). Es lo UNICO del
  # stack que se expone por dominio; openmemory-mcp sigue en loopback y solo
  # este servicio lo alcanza por la red interna. Auth por token individual
  # (hash en ACCESS_DEVS); reenvia solo /mcp/* de Mem0 e inyecta del lado
  # servidor las credenciales reales de cada backend.
  # Coolify -> Domains del servicio `access`:
  #   https://memory.omniaos.ai:8080,https://kb.omniaos.ai:8080,https://memorypanel.omniaos.ai:8080  (con esquema)
  access:
    build: ./access
    image: omnia/memory-access:latest
    restart: unless-stopped
    environment:
      - ACCESS_DEVS=${ACCESS_DEVS}
      # Admin de emergencia ("id:hash", siempre rol admin, no se edita desde el panel).
      - ACCESS_ADMINS=${ACCESS_ADMINS:-}
      # Vacio = AUDITORIA: se registra lo que las politicas denegarian, sin bloquear.
      # Poner 1 solo cuando el registro salga limpio (ver memory/PERMISOS.md).
      - ACCESS_ENFORCE=${ACCESS_ENFORCE:-}
      # Namespaces antiguos de Mem0 tratados como un espacio, sin mover datos: `vision-infra=proy-vision-infra,frutal=int-frutal`.
      - ACCESS_NAMESPACE_ALIASES=${ACCESS_NAMESPACE_ALIASES:-}
      # Alias gestionados desde el portal (sin redeploy). Vive en el volumen de datos.
      - ACCESS_ALIASES_FILE=/data/aliases.json
      # Memoria corta: servicio propio del gateway (sin LLM al escribir; solo embeddings). Con MEM0_BACKEND=openmemory
      # (o sin OPENAI_API_KEY) se usa el contenedor openmemory-mcp como antes.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-text-embedding-3-small}
      - MEM0_BACKEND=${MEM0_BACKEND:-}
      # El grafo del portal lee los textos de las memorias directo de Qdrant (red interna).
      - QDRANT_URL=http://mem0_store:6333
      # Personas dadas de alta desde el panel (altas y bajas sin redeploy). Vive en un volumen.
      - ACCESS_USERS_FILE=/data/users.json
      # Contrasenas (scrypt), invitaciones y sesiones del portal: solo hashes.
      - ACCESS_PORTAL_FILE=/data/portal.json
      - MEM0_UPSTREAM=http://openmemory-mcp:8765
      - OPENMEMORY_API_KEY=${OPENMEMORY_API_KEY}
      # Basic Memory vive en otro VPS: se alcanza por su dominio de origen con
      # la credencial de servicio que ya tiene (base64 de usuario:clave).
      - KB_UPSTREAM=${KB_UPSTREAM:-https://knowledge.omniaos.ai}
      - KB_UPSTREAM_AUTH_B64=${KB_UPSTREAM_AUTH_B64}
    depends_on:
      - openmemory-mcp
    volumes:
      - access_data:/data
    expose:
      - "8080"

  # Respaldo cifrado y diario de Mem0 (Qdrant + SQLite) a S3/R2. Ver backup/README.md.
  # Sin BACKUP_PASSPHRASE no respalda nada; sin BACKUP_S3_* solo deja copia local.
  backup:
    build: ./backup
    image: omnia/memory-backup:latest
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://mem0_store:6333
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_KEY_ID=${BACKUP_S3_KEY_ID:-}
      - BACKUP_S3_SECRET=${BACKUP_S3_SECRET:-}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
    depends_on:
      - mem0_store
      - openmemory-mcp
    volumes:
      - openmemory_data:/data:ro
      - openmemory_mem0home:/mem0home:ro
      - access_data:/accessdata:ro
      - backup_local:/backups

  hermes:
    build: ./hermes
    image: omnia/hermes:latest
    restart: unless-stopped
    environment:
      # Memoria destino (proponer, no escribir directo — ver hermes/README.md)
      - OMNIA_MEMORY_MCP_URL=http://openmemory-mcp:8765
      - OPENMEMORY_API_KEY=${OPENMEMORY_API_KEY}
      # LLM programático vía gateway (API key de pago — NO suscripciones/ToS)
      - HERMES_LLM_BASE_URL=${HERMES_LLM_BASE_URL}
      - HERMES_LLM_API_KEY=${HERMES_LLM_API_KEY}
      - HERMES_LLM_MODEL=${HERMES_LLM_MODEL:-glm}
      # Repos a observar y destino de propuestas (PR de aprobación)
      - HERMES_REPOS=${HERMES_REPOS}
      - HERMES_PROPOSALS_REMOTE=${HERMES_PROPOSALS_REMOTE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Token con WRITE solo en el repo de propuestas (Contents+PR write en vision-infra).
      - HERMES_PROPOSALS_TOKEN=${HERMES_PROPOSALS_TOKEN}
      # Cadencia del daemon (segundos). Coolify también puede correrlo por cron.
      - HERMES_INTERVAL=${HERMES_INTERVAL:-86400}
    depends_on:
      - openmemory-mcp
    volumes:
      - hermes_state:/app/state

volumes:
  qdrant_storage:
  openmemory_data:
  openmemory_mem0home:
  backup_local:
  access_data:
  hermes_state:
