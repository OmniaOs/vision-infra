# Sirve unicamente memory/setup/windows.ps1 y memory/tunnel.sh, en texto
# plano, para que `irm https://vault.omniaos.ai/setup | iex` funcione sin
# necesitar que el navegador/cliente adivine un content-type.
#
# Coolify enruta este servicio via "Domains for setup" = .../setup, y
# Traefik agrega automaticamente un middleware stripprefix (/setup) antes
# de reenviar al contenedor -- confirmado con `docker inspect` en vivo
# (traefik.http.middlewares...-setup-stripprefix.stripprefix.prefixes:
# /setup). Por eso las rutas de abajo son relativas a la RAIZ del
# contenedor, no a /setup -- las requests ya llegan sin ese prefijo.
#
# `alias` en un `location = /` exacto revienta con 500 en nginx (bug/gotcha
# conocido -- confirmado en la practica: /tunnel.sh andaba bien con alias,
# la raiz no). `try_files` con `root` evita el problema.
server {
  listen 80;
  default_type text/plain;
  charset utf-8;
  root /usr/share/nginx/html;

  location = / {
    try_files /windows.ps1 =404;
  }

  location = /tunnel.sh {
    try_files /tunnel.sh =404;
  }

  location / {
    return 404;
  }
}
