# Omnia -- Vaultwarden (custodia de llaves SSH del equipo para el tunel de
# memoria compartida; server Bitwarden-compatible, self-hosted).
#
# SEGURIDAD (mismo patron post-incidente 20-jul-2026 que gateway/memory/
# metrics-hub, ver DEPLOY_COOLIFY.md): puerto publicado solo en 127.0.0.1 --
# acceso remoto por dominio autenticado (Traefik + Coolify), nunca puerto
# abierto a internet sin auth. SIGNUPS_ALLOWED=false: solo se entra por
# invitacion del admin, nunca por registro abierto.
#
# Spec: vision/specs/services/self-service-memory-tunnel-onboarding/
services:
  vault:
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      - DOMAIN=${VAULT_DOMAIN}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - WEBSOCKET_ENABLED=true
      # SMTP deliberadamente sin cablear: Vaultwarden trata la sola presencia
      # de SMTP_PORT (aunque este vacia) como "SMTP configurado" y exige
      # SMTP_HOST+SMTP_FROM -- no alcanza con dejarlas vacias, hay que omitir
      # las 5 variables por completo mientras no se use SMTP. Sin SMTP, las
      # invitaciones se copian a mano desde el panel /admin. Si en el futuro
      # se configura SMTP real, agregar aqui las 5 variables juntas (nunca
      # solo SMTP_PORT) y sus secrets en Coolify.
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - vault_data:/data

volumes:
  vault_data:
