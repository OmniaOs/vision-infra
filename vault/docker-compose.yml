# Omnia -- Vaultwarden (custodia de llaves SSH del equipo para el tunel de
# memoria compartida; server Bitwarden-compatible, self-hosted).
#
# SEGURIDAD (mismo patron post-incidente 20-jul-2026 que gateway/memory/
# metrics-hub, ver DEPLOY_COOLIFY.md): puerto publicado solo en 127.0.0.1 --
# acceso remoto por dominio autenticado (Traefik + Coolify), nunca puerto
# abierto a internet sin auth. SIGNUPS_ALLOWED=false: solo se entra por
# invitacion del admin, nunca por registro abierto.
#
# Spec: vision/specs/services/self-service-memory-tunnel-onboarding/
services:
  vault:
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      - DOMAIN=${VAULT_DOMAIN}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - WEBSOCKET_ENABLED=true
      # SMTP real (Mailgun) -- necesario porque Vaultwarden no expone el link
      # de invitacion en ningun lado accesible cuando el mail esta deshabilitado
      # (confirmado en la practica: ni logs ni la UI del admin panel lo
      # muestran). Las 5 variables van siempre juntas -- dejar solo alguna
      # vacia revienta el arranque (ver historial de esta spec).
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_SECURITY=starttls
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=Omnia Vault
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - vault_data:/data

  # Bootstrap de una sola linea: `irm https://vault.omniaos.ai/setup | iex`.
  # Reutiliza el mismo recurso Coolify que vault (cero infraestructura
  # nueva). Dominio propio via el campo "Domains for setup" que Coolify
  # genera solo al detectar un segundo servicio en el compose -- se probo
  # primero con labels de Traefik escritas a mano (Host + PathPrefix) y
  # eso hizo que Coolify dejara de aplicarle SUS PROPIAS labels a `vault`
  # en el siguiente deploy (vault quedo sin ningun label de Traefik,
  # confirmado con `docker inspect` -- 503 hasta en la raiz). Dejar que
  # Coolify autogenere el router de `setup` igual que ya hace con
  # vault/gateway/metrics-hub evita ese conflicto.
  setup:
    build:
      context: ..
      dockerfile: vault/setup/Dockerfile
    restart: unless-stopped

volumes:
  vault_data:
