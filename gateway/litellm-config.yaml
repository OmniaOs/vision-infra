# Configuración del gateway LiteLLM de Omnia.
# Único proveedor: GLM 5.2 (z.ai), API de pago — para cargas PROGRAMÁTICAS
# (Hermes, CI, agentes batch) y BYOK. El trabajo interactivo NO pasa por aquí:
# cada dev usa su seat de Claude Team en Claude Code (flat-rate, sin API key).
model_list:
  # --- GLM 5.2 (z.ai) — plan + ejecución ---
  # LiteLLM tiene provider nativo `zai/`. Usa ZAI_API_KEY.
  - model_name: glm            # alias que piden los clientes (Kilo/Hermes)
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
      # Coding Plan de z.ai: descomenta el api_base del endpoint /coding/ (es más
      # barato por volumen). Pago-por-token normal: deja el default (api/paas/v4).
      # api_base: https://api.z.ai/api/coding/paas/v4

  # Alias explícitos por si quieres separar tiers apuntando al mismo modelo:
  - model_name: glm-planner
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
  - model_name: glm-executor
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY

litellm_settings:
  drop_params: true
  # tracking de tokens/costo por virtual key queda en Postgres (DATABASE_URL)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # UI de uso en http://<host>:4000/ui
