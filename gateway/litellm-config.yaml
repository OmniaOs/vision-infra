# Configuración del gateway LiteLLM de Omnia.
# Proveedor: GLM (z.ai) vía el **endpoint de CODING** (/api/coding/paas/v4) —
# usa la cuota del GLM Coding Plan (NO saldo prepago; el endpoint general
# /api/paas/v4 sí requiere créditos y da error 1113 sin saldo).
# Para cargas PROGRAMÁTICAS (Hermes, CI, BYOK). El dev interactivo usa su seat
# de Claude Team en Claude Code, no el gateway.
model_list:
  # Workhorse: GLM 4.6 — salida limpia y más ligero para el Coding Lite + Hermes.
  - model_name: glm
    litellm_params:
      model: openai/glm-4.6
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
  # Flagship: GLM 5.2 — para el trabajo de coding más pesado.
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
  - model_name: glm-4.7
    litellm_params:
      model: openai/glm-4.7
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY

litellm_settings:
  drop_params: true
  # tracking de tokens/costo por virtual key queda en Postgres (DATABASE_URL)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # UI de uso en http://<host>:4000/ui
